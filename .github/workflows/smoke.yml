name: Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/p9-release

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOKE_RESULTS_DIR: results/failures/docker-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Capture environment
        run: scripts/capture_environment.sh "$SMOKE_RESULTS_DIR/environment.txt"

      - name: Run smoke test
        run: |
          set -o pipefail
          bash scripts/smoke_test.sh 2>&1 | tee "$SMOKE_RESULTS_DIR/smoke.log"

      - name: Run Redis outage and recovery test
        run: |
          set -o pipefail
          bash scripts/redis_recovery_test.sh 2>&1 | tee "$SMOKE_RESULTS_DIR/redis-recovery.log"

      - name: Dump docker compose state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=80

      - name: Clean up containers
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-recovery-evidence
          path: results/failures/docker-ci
          if-no-files-found: error
