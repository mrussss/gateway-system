apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: gateway-system
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: gateway-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
        app.kubernetes.io/part-of: gateway-system
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: gateway-system/control-plane:v2-local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gateway-system-config
          env:
            - name: CONTROL_PLANE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-system-secrets
                  key: admin-token
            - name: GATEWAY_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-system-secrets
                  key: gateway-token
            - name: TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: gateway-system-secrets
                  key: token-pepper
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
