apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-system-config
  namespace: gateway-system
data:
  APP_ENV: production
  STORE_BACKEND: redis
  REDIS_ADDR: redis:6379
  AUTH_FAILURE_LIMIT: "5"
  AUTH_FAILURE_WINDOW_SECONDS: "60"
  GATEWAY_PORT: "9000"
  CONTROL_PLANE_HOST: control-plane
  CONTROL_PLANE_PORT: "8080"
  CONTROL_PLANE_TIMEOUT_MS: "1000"
  AUTH_WORKER_COUNT: "2"
  AUTH_QUEUE_CAPACITY: "32"
  REQUEST_QUEUE_CAPACITY: "4096"
  RESPONSE_QUEUE_CAPACITY: "4096"
  SHUTDOWN_TIMEOUT_MS: "20000"
  GATEWAY_LOG_LEVEL: INFO
