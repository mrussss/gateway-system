apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: gateway-system
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: gateway-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
